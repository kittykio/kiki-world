<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 72" role="img" aria-labelledby="title description">
  <title id="title">Kiki World</title>
  <desc id="description">A neon room portal beside the Kiki World name</desc>
  <defs>
    <linearGradient id="neon-logo" x1="5" y1="4" x2="67" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00f5ff"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <path d="M8 18 35 4l27 14v38L35 70 8 56Z" fill="#070711" stroke="url(#neon-logo)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M21 24h28v33L35 64 21 57Z" fill="#0d0d1d" stroke="#b7ff00" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="42" cy="42" r="2.5" fill="#00f5ff"/>
  </g>
  <g fill="#f8f7ff" font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="45" font-size="29" font-weight="700" letter-spacing="5">KIKI WORLD</text>
  </g>
</svg>
